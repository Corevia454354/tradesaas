<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6bff">
  <meta name="description" content="Quotes, jobs, certificates, invoices and your team in one place, built for South African trades businesses.">
  <title>Tradeline</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app"><div class="center muted pad">Loading…</div></div>
  <noscript><p class="center pad">This app needs JavaScript turned on.</p></noscript>

  <script>
    // If the app fails to start, say why instead of leaving a blank page.
    (function () {
      var done = false;
      window.__fail = function (msg) {
        var app = document.getElementById('app');
        if (done || window.__appReady || !app) return;
        done = true;
        app.innerHTML =
          '<div class="auth"><h1>The app could not start</h1><p class="err" id="why"></p>' +
          '<p class="muted">Things to check:</p><ul class="muted">' +
          '<li>Open the site through its web address (your Vercel URL, or <code>npx serve public</code>), not by double-clicking the file.</li>' +
          '<li>You are online: the app loads Firebase from gstatic.com.</li>' +
          '<li>The Firebase settings in <code>public/firebase-config.js</code> are filled in.</li>' +
          '<li>Press F12 and open the Console tab to see the exact error.</li></ul></div>';
        document.getElementById('why').textContent = msg;
      };
      window.addEventListener('error', function (e) { window.__fail(e.message || 'Unknown script error'); });
      window.addEventListener('unhandledrejection', function (e) {
        window.__fail((e.reason && e.reason.message) || String(e.reason));
      });
      setTimeout(function () { window.__fail('Still loading after 10 seconds.'); }, 10000);
    })();
  </script>
  <script type="module" src="/boot.js"
    onerror="window.__fail('Could not load the app. Open the site through its web address, not as a file.')"></script>
</body>
</html>
