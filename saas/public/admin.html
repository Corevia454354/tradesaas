<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Tradeline admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <style>
    main.wide { max-width: 980px; }
    table.t { width: 100%; border-collapse: collapse; font-size: .9rem; }
    table.t th, table.t td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    .scroll { overflow-x: auto; }
    .tag { font-size: .72rem; padding: .1rem .5rem; border-radius: 99px; background: #eef2f6; color: var(--muted); font-weight: 600; }
    .tag.ok { background: #e3f6ec; color: var(--ok); } .tag.bad { background: #fde8e6; color: var(--bad); } .tag.warn { background: #fdf0e1; color: var(--warn); }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; } @media (max-width: 560px) { .two { grid-template-columns: 1fr; } }
    .adm label { display: block; font-size: .85rem; color: var(--muted); margin: .5rem 0 .15rem; }
    .adm input, .adm select, .adm textarea { width: 100%; padding: .5rem; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; }
    .adm input[type=checkbox] { width: auto; }
    .adm .inl { display: flex; gap: .5rem; align-items: center; color: var(--ink); }
    .adm .btns { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .7rem; }
    .adm pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-size: .8rem; }
  </style>
</head>
<body>
  <div id="app"><div class="center muted pad">Loading…</div></div>
  <script type="module" src="/admin.js"
    onerror="document.getElementById('app').textContent='Could not load admin.js. Open this page through its web address.'"></script>
</body>
</html>
